name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  backend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
    - name: Загрузка код репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt          # основные зависимости
        pip install -r ../requirements-dev.txt   # для линтеров и тестов

    - name: Линтинг с flake8
      run: flake8 .

    - name: Проверка форматирования через black
      run: black --check .

    - name: Проверка порядка импортов через isort
      run: isort --check-only .

    - name: Запуск тестов с pytest
      run: pytest tests/ -v --cov=app --cov-report=term
      env:
        PYTHONPATH: .

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Загрузка кода репозитория
      uses: actions/checkout@v4

    - name: Установка Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Установка глобальных линтеров для HTML/CSS/JS
      run: |
        npm install -g html-validate stylelint eslint

    - name: Проверка валидности HTML
      run: html-validate "client/*.html"

    - name: Установка stylelint конфига
      run: npm install -g stylelint-config-standard

    - name: Проверка стилей CSS
      run: stylelint "client/*.css"

    - name: Проверка JavaScript
      run: eslint "client/*.js"