name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  backend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
    - name: Загрузка код репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt          # основные зависимости
        pip install -r ../requirements-dev.txt   # для линтеров и тестов

    - name: Линтинг с flake8
      run: flake8 .

    - name: Проверка форматирования через black
      run: black --check .

    - name: Проверка порядка импортов через isort
      run: isort --check-only .

    - name: Запуск тестов с pytest
      run: pytest tests/ -v --cov=app --cov-report=term
      env:
        PYTHONPATH: .

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Загрузка кода репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка локальных зависимостей
        run: npm ci

      - name: Проверка валидности HTML
        run: npx html-validate "client/*.html"

      - name: Проверка стилей CSS
        run: npx stylelint "client/*.css"

      - name: Проверка JavaScript
        run: npx eslint "client/*.js"