version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: mortgage-backend
    ports:
      - "8000:8000"
    volumes:
      - ../server:/app
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: mortgage-frontend
    ports:
      - "80:80"
    restart: unless-stopped